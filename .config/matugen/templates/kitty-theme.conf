# Generated by matugen from the current wallpaper (wall.* = the image's own colors, from ~/.local/bin/wallpalette) — edit
# ~/.config/matugen/templates/kitty-theme.conf instead of this file.

foreground              {{wall.fg}}
background              {{wall.bg}}
selection_foreground    {{wall.fg}}
selection_background    {{wall.surface2}}
cursor                  {{wall.accent1}}
cursor_text_color       {{wall.bg}}
url_color               {{wall.accent3}}

active_border_color     {{wall.seg1}}
inactive_border_color   {{wall.surface2}}
active_tab_foreground   {{wall.bg}}
active_tab_background   {{wall.seg1}}
inactive_tab_foreground {{wall.fgdim}}
inactive_tab_background {{wall.surface}}
tab_bar_background      {{wall.bg}}

# black
color0  {{wall.surface2}}
color8  {{wall.fgdim}}
# red
color1  {{colors.red.default.hex | lighten: -16 | saturate: -35, "hsl"}}
color9  {{colors.on_red_container.default.hex | lighten: -14 | saturate: -30, "hsl"}}
# green
color2  {{colors.green.default.hex | lighten: -16 | saturate: -35, "hsl"}}
color10 {{colors.on_green_container.default.hex | lighten: -14 | saturate: -30, "hsl"}}
# yellow
color3  {{colors.yellow.default.hex | lighten: -16 | saturate: -35, "hsl"}}
color11 {{colors.on_yellow_container.default.hex | lighten: -14 | saturate: -30, "hsl"}}
# blue
color4  {{wall.ansi1}}
color12 {{wall.accent1}}
# magenta
color5  {{wall.ansi2}}
color13 {{wall.accent2}}
# cyan
color6  {{wall.ansi3}}
color14 {{wall.accent3}}
# white
color7  {{wall.fgdim}}
color15 {{wall.fg}}
